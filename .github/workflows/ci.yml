name: Build and audit
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flowdeck-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install audit tools
        run: brew install xcodegen gitleaks
      - name: Select Xcode 26
        run: |
          XCODE_APP=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -1)
          test -n "$XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - name: Public delivery and secrets
        run: |
          python3 Scripts/check_public_release.py
          gitleaks git --redact --no-banner --log-opts=--all
      - name: Generate project
        run: |
          xcodegen generate
          git diff --exit-code -- FlowDeck.xcodeproj FlowDeck/Info.plist FlowDeckWidget/Info.plist
      - name: Choose Simulator
        run: |
          xcrun simctl list devices available --json > /tmp/simulators.json
          python3 - <<'PY'
          import json
          import os
          devices = json.load(open('/tmp/simulators.json'))['devices']
          choices = [device['udid'] for runtime, entries in sorted(devices.items())
                     if 'iOS-26' in runtime for device in entries if device['name'].startswith('iPhone')]
          if not choices:
              raise SystemExit('An iOS 26 Simulator runtime is required')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('SIMULATOR_ID=' + choices[-1] + '\n')
          PY
      - name: Unit tests
        run: |
          xcodebuild -project FlowDeck.xcodeproj -scheme FlowDeck \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath /tmp/FlowDeckBuild \
            -resultBundlePath /tmp/FlowDeckTests.xcresult \
            -parallel-testing-enabled NO -only-testing:FlowDeckTests test
      - name: Host transaction tests
        run: |
          APP_DATA=$(xcrun simctl get_app_container "$SIMULATOR_ID" org.flowdeck.app data)
          python3 Scripts/Tests/run_f50_transactions.py "$APP_DATA/Documents"
      - name: Release build
        run: |
          xcodebuild -project FlowDeck.xcodeproj -scheme FlowDeck -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/FlowDeckBuild build
  android-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify bridge from source
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36.1' 'build-tools;36.1.0'
          sh Scripts/F50ConfigBridge/build.sh --check
          sh Scripts/F50ConfigBridge/test_probe.sh
